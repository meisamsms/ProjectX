name: Verify foundation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: projectx_test
          POSTGRES_USER: projectx_test
          POSTGRES_PASSWORD: test-only-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectx_test -d projectx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://projectx_test:test-only-secret@localhost:5432/projectx_test
      TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm verify:db
